<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Candy Crunch</title>
<style>
  :root {
    --board-bg: rgba(255, 255, 255, 0.12);
    --cell: 56px;
    --gap: 6px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(160deg, #3a1c71, #d76d77, #ffaf7b);
    color: #fff;
    overflow: hidden;
    user-select: none;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 12px;
  }

  .game {
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  header { text-align: center; }

  h1 {
    font-size: 34px;
    font-weight: 800;
    letter-spacing: 1px;
    text-shadow: 0 3px 0 rgba(0,0,0,0.25);
  }
  h1 .c { display: inline-block; }

  .stats {
    display: flex;
    justify-content: space-between;
    gap: 10px;
  }

  .stat {
    flex: 1;
    background: rgba(0,0,0,0.22);
    border-radius: 14px;
    padding: 8px 6px;
    text-align: center;
    backdrop-filter: blur(4px);
  }
  .stat .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    opacity: 0.75;
  }
  .stat .value {
    font-size: 22px;
    font-weight: 700;
  }

  .board-wrap {
    position: relative;
    align-self: center;
  }

  #board {
    display: grid;
    gap: var(--gap);
    padding: var(--gap);
    background: var(--board-bg);
    border-radius: 18px;
    box-shadow: inset 0 2px 10px rgba(0,0,0,0.3);
    touch-action: none;
  }

  .cell {
    width: var(--cell);
    height: var(--cell);
    border-radius: 12px;
    background: rgba(0,0,0,0.15);
    position: relative;
  }

  .candy {
    position: absolute;
    inset: 3px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    box-shadow: inset -4px -4px 8px rgba(0,0,0,0.25), inset 3px 3px 6px rgba(255,255,255,0.35);
    transition: transform 0.16s ease, opacity 0.16s ease;
    will-change: transform;
  }
  .candy.selected {
    transform: scale(1.16);
    box-shadow: 0 0 0 3px #fff, inset -4px -4px 8px rgba(0,0,0,0.25);
    z-index: 3;
  }
  .candy.pop {
    transform: scale(0);
    opacity: 0;
  }
  .candy.falling {
    transition: transform 0.28s cubic-bezier(.34,1.4,.64,1);
  }

  .c0 { background: radial-gradient(circle at 32% 28%, #ff8a8a, #e01e1e); }
  .c1 { background: radial-gradient(circle at 32% 28%, #ffd27f, #f5940b); }
  .c2 { background: radial-gradient(circle at 32% 28%, #fff28a, #e5c400); }
  .c3 { background: radial-gradient(circle at 32% 28%, #9dffb0, #17a836); }
  .c4 { background: radial-gradient(circle at 32% 28%, #9ad4ff, #1275e0); }
  .c5 { background: radial-gradient(circle at 32% 28%, #d7a8ff, #8b26d9); }

  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(20, 6, 40, 0.82);
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 20px;
    backdrop-filter: blur(3px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    z-index: 10;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .overlay h2 { font-size: 30px; }
  .overlay p { font-size: 16px; opacity: 0.9; }

  button {
    font-family: inherit;
    font-size: 17px;
    font-weight: 700;
    color: #3a1c71;
    background: #fff;
    border: none;
    border-radius: 30px;
    padding: 12px 28px;
    cursor: pointer;
    box-shadow: 0 4px 0 rgba(0,0,0,0.25);
    transition: transform 0.1s;
  }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,0.25); }

  .footer { text-align: center; font-size: 13px; opacity: 0.7; }

  .float-score {
    position: absolute;
    font-weight: 800;
    font-size: 20px;
    color: #fff;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    pointer-events: none;
    animation: floatUp 0.7s ease-out forwards;
    z-index: 5;
  }
  @keyframes floatUp {
    0% { transform: translateY(0) scale(0.6); opacity: 0; }
    30% { opacity: 1; transform: translateY(-6px) scale(1.1); }
    100% { transform: translateY(-38px) scale(1); opacity: 0; }
  }
</style>
</head>
<body>
  <div class="game">
    <header>
      <h1>🍬 Candy Crunch</h1>
    </header>

    <div class="stats">
      <div class="stat"><div class="label">Score</div><div class="value" id="score">0</div></div>
      <div class="stat"><div class="label">Target</div><div class="value" id="target">1500</div></div>
      <div class="stat"><div class="label">Moves</div><div class="value" id="moves">20</div></div>
    </div>

    <div class="board-wrap">
      <div id="board"></div>
      <div class="overlay" id="overlay">
        <h2 id="over-title">Level Complete!</h2>
        <p id="over-msg"></p>
        <button id="restart">Play Again</button>
      </div>
    </div>

    <div class="footer">Swap adjacent candies to match 3 or more. Tap two neighbors or drag.</div>
  </div>

<script>
(() => {
  "use strict";

  const SIZE = 8;
  const TYPES = 6;
  const EMOJI = ["🍒", "🍊", "🍋", "🍏", "🫐", "🍇"];
  const START_MOVES = 20;
  const TARGET = 1500;

  const boardEl = document.getElementById("board");
  const scoreEl = document.getElementById("score");
  const movesEl = document.getElementById("moves");
  const targetEl = document.getElementById("target");
  const overlay = document.getElementById("overlay");
  const overTitle = document.getElementById("over-title");
  const overMsg = document.getElementById("over-msg");
  const restartBtn = document.getElementById("restart");

  let grid = [];        // grid[r][c] = type index or -1
  let cells = [];       // DOM cell wrappers
  let score = 0;
  let moves = START_MOVES;
  let busy = false;     // block input during animations
  let selected = null;  // {r, c}

  targetEl.textContent = TARGET;

  const idx = (r, c) => r * SIZE + c;
  const inBounds = (r, c) => r >= 0 && r < SIZE && c >= 0 && c < SIZE;
  const rand = () => Math.floor(Math.random() * TYPES);
  const delay = (ms) => new Promise(res => setTimeout(res, ms));

  // ---- Board setup ----
  function buildDOM() {
    boardEl.style.gridTemplateColumns = `repeat(${SIZE}, var(--cell))`;
    boardEl.innerHTML = "";
    cells = [];
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.dataset.r = r;
        cell.dataset.c = c;
        boardEl.appendChild(cell);
        cells.push(cell);
      }
    }
  }

  // Fill grid ensuring no pre-existing matches
  function fillGrid() {
    grid = [];
    for (let r = 0; r < SIZE; r++) {
      grid.push([]);
      for (let c = 0; c < SIZE; c++) {
        let t;
        do {
          t = rand();
        } while (
          (c >= 2 && grid[r][c-1] === t && grid[r][c-2] === t) ||
          (r >= 2 && grid[r-1][c] === t && grid[r-2][c] === t)
        );
        grid[r].push(t);
      }
    }
    // guarantee at least one possible move
    if (!hasPossibleMove()) fillGrid();
  }

  function renderAll() {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        renderCell(r, c);
      }
    }
  }

  function renderCell(r, c) {
    const cell = cells[idx(r, c)];
    cell.innerHTML = "";
    const t = grid[r][c];
    if (t < 0) return;
    const candy = document.createElement("div");
    candy.className = `candy c${t}`;
    candy.textContent = EMOJI[t];
    candy.dataset.r = r;
    candy.dataset.c = c;
    cell.appendChild(candy);
  }

  function candyAt(r, c) {
    return cells[idx(r, c)].firstChild;
  }

  // ---- Match detection ----
  function findMatches() {
    const matched = new Set();
    // horizontal
    for (let r = 0; r < SIZE; r++) {
      let run = 1;
      for (let c = 1; c <= SIZE; c++) {
        if (c < SIZE && grid[r][c] === grid[r][c-1] && grid[r][c] >= 0) {
          run++;
        } else {
          if (run >= 3) {
            for (let k = c - run; k < c; k++) matched.add(idx(r, k));
          }
          run = 1;
        }
      }
    }
    // vertical
    for (let c = 0; c < SIZE; c++) {
      let run = 1;
      for (let r = 1; r <= SIZE; r++) {
        if (r < SIZE && grid[r][c] === grid[r-1][c] && grid[r][c] >= 0) {
          run++;
        } else {
          if (run >= 3) {
            for (let k = r - run; k < r; k++) matched.add(idx(k, c));
          }
          run = 1;
        }
      }
    }
    return matched;
  }

  // Does swapping (r1,c1) and (r2,c2) create a match?
  function wouldMatch(r1, c1, r2, c2) {
    swapData(r1, c1, r2, c2);
    const m = findMatches();
    swapData(r1, c1, r2, c2);
    return m.size > 0;
  }

  function hasPossibleMove() {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (c + 1 < SIZE && wouldMatch(r, c, r, c + 1)) return true;
        if (r + 1 < SIZE && wouldMatch(r, c, r + 1, c)) return true;
      }
    }
    return false;
  }

  function swapData(r1, c1, r2, c2) {
    const tmp = grid[r1][c1];
    grid[r1][c1] = grid[r2][c2];
    grid[r2][c2] = tmp;
  }

  // ---- Interaction ----
  async function trySwap(r1, c1, r2, c2) {
    if (busy) return;
    if (!inBounds(r2, c2)) return;
    busy = true;
    clearSelection();

    // animate visual swap
    await animateSwap(r1, c1, r2, c2);
    swapData(r1, c1, r2, c2);
    renderCell(r1, c1);
    renderCell(r2, c2);

    const matches = findMatches();
    if (matches.size === 0) {
      // swap back
      await animateSwap(r1, c1, r2, c2);
      swapData(r1, c1, r2, c2);
      renderCell(r1, c1);
      renderCell(r2, c2);
      busy = false;
      return;
    }

    moves--;
    updateStats();
    await resolveBoard();
    busy = false;
    checkEndState();
  }

  function animateSwap(r1, c1, r2, c2) {
    const a = candyAt(r1, c1);
    const b = candyAt(r2, c2);
    if (!a || !b) return Promise.resolve();
    const dx = (c2 - c1);
    const dy = (r2 - r1);
    const step = parseGap();
    a.style.transform = `translate(${dx * step}px, ${dy * step}px)`;
    b.style.transform = `translate(${-dx * step}px, ${-dy * step}px)`;
    return delay(170).then(() => {
      a.style.transform = "";
      b.style.transform = "";
    });
  }

  function parseGap() {
    const styles = getComputedStyle(document.documentElement);
    const cell = parseFloat(styles.getPropertyValue("--cell"));
    const gap = parseFloat(styles.getPropertyValue("--gap"));
    return cell + gap;
  }

  // ---- Resolve: clear matches, drop, refill, cascade ----
  async function resolveBoard() {
    let cascade = 0;
    while (true) {
      const matches = findMatches();
      if (matches.size === 0) break;
      cascade++;

      // scoring: bigger clears + cascade multiplier
      const gained = matches.size * 30 * cascade;
      score += gained;
      showFloatScore(matches, gained);
      updateStats();

      // pop animation
      matches.forEach(i => {
        const cell = cells[i];
        if (cell.firstChild) cell.firstChild.classList.add("pop");
      });
      await delay(180);

      // remove from grid
      matches.forEach(i => {
        const r = Math.floor(i / SIZE);
        const c = i % SIZE;
        grid[r][c] = -1;
      });

      applyGravity();
      await animateDrops();
    }
  }

  function applyGravity() {
    for (let c = 0; c < SIZE; c++) {
      let write = SIZE - 1;
      for (let r = SIZE - 1; r >= 0; r--) {
        if (grid[r][c] >= 0) {
          grid[write][c] = grid[r][c];
          if (write !== r) grid[r][c] = -1;
          write--;
        }
      }
      // fill remaining top with new candies
      for (let r = write; r >= 0; r--) {
        grid[r][c] = rand();
      }
    }
  }

  async function animateDrops() {
    // re-render everything, then animate a subtle drop-in
    renderAll();
    const candies = boardEl.querySelectorAll(".candy");
    candies.forEach(cd => {
      cd.classList.add("falling");
      cd.style.transform = "translateY(-12px)";
      cd.style.opacity = "0.4";
    });
    // force reflow
    void boardEl.offsetHeight;
    requestAnimationFrame(() => {
      candies.forEach(cd => {
        cd.style.transform = "";
        cd.style.opacity = "";
      });
    });
    await delay(280);
    candies.forEach(cd => cd.classList.remove("falling"));
  }

  function showFloatScore(matches, gained) {
    // place near the centroid of matched cells
    let sr = 0, sc = 0;
    matches.forEach(i => { sr += Math.floor(i / SIZE); sc += i % SIZE; });
    const n = matches.size;
    const r = sr / n, c = sc / n;
    const step = parseGap();
    const fs = document.createElement("div");
    fs.className = "float-score";
    fs.textContent = "+" + gained;
    fs.style.left = (c * step + 6) + "px";
    fs.style.top = (r * step + 6) + "px";
    document.querySelector(".board-wrap").appendChild(fs);
    setTimeout(() => fs.remove(), 700);
  }

  // ---- Input handling (tap + drag) ----
  let dragStart = null;

  boardEl.addEventListener("pointerdown", (e) => {
    const candy = e.target.closest(".candy");
    if (!candy || busy) return;
    const r = +candy.dataset.r, c = +candy.dataset.c;
    dragStart = { r, c, x: e.clientX, y: e.clientY };

    if (selected) {
      const dr = Math.abs(selected.r - r);
      const dc = Math.abs(selected.c - c);
      if (dr + dc === 1) {
        trySwap(selected.r, selected.c, r, c);
        return;
      }
    }
    selectCandy(r, c);
  });

  boardEl.addEventListener("pointerup", (e) => {
    if (!dragStart || busy) { dragStart = null; return; }
    const dx = e.clientX - dragStart.x;
    const dy = e.clientY - dragStart.y;
    const absX = Math.abs(dx), absY = Math.abs(dy);
    if (Math.max(absX, absY) > 18) {
      let nr = dragStart.r, nc = dragStart.c;
      if (absX > absY) nc += dx > 0 ? 1 : -1;
      else nr += dy > 0 ? 1 : -1;
      trySwap(dragStart.r, dragStart.c, nr, nc);
    }
    dragStart = null;
  });

  function selectCandy(r, c) {
    clearSelection();
    selected = { r, c };
    const cd = candyAt(r, c);
    if (cd) cd.classList.add("selected");
  }

  function clearSelection() {
    if (selected) {
      const cd = candyAt(selected.r, selected.c);
      if (cd) cd.classList.remove("selected");
    }
    selected = null;
  }

  // ---- Stats & end state ----
  function updateStats() {
    scoreEl.textContent = score;
    movesEl.textContent = moves;
  }

  function checkEndState() {
    if (score >= TARGET) {
      endGame(true);
    } else if (moves <= 0) {
      endGame(false);
    } else if (!hasPossibleMove()) {
      // reshuffle to keep it playable
      reshuffle();
    }
  }

  async function reshuffle() {
    busy = true;
    do {
      // flatten and shuffle
      const flat = [];
      for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) flat.push(grid[r][c]);
      for (let i = flat.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [flat[i], flat[j]] = [flat[j], flat[i]];
      }
      let k = 0;
      for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) grid[r][c] = flat[k++];
    } while (findMatches().size > 0 || !hasPossibleMove());
    renderAll();
    busy = false;
  }

  function endGame(won) {
    overTitle.textContent = won ? "🎉 You Win!" : "Out of Moves";
    overMsg.textContent = won
      ? `You smashed the target with ${score} points and ${moves} moves to spare!`
      : `You scored ${score}. Target was ${TARGET}. So close — try again!`;
    overlay.classList.add("show");
  }

  restartBtn.addEventListener("click", init);

  // ---- Init ----
  function init() {
    overlay.classList.remove("show");
    score = 0;
    moves = START_MOVES;
    selected = null;
    busy = false;
    buildDOM();
    fillGrid();
    renderAll();
    updateStats();
    // resolve any accidental starting matches silently
    resolveInitial();
  }

  async function resolveInitial() {
    if (findMatches().size > 0) {
      busy = true;
      await resolveBoard();
      score = 0;
      updateStats();
      busy = false;
    }
  }

  // Responsive cell sizing for small screens
  function fitBoard() {
    const maxW = Math.min(window.innerWidth - 24, 440);
    const gap = 6;
    const cell = Math.floor((maxW - gap * (SIZE + 1)) / SIZE);
    const clamped = Math.max(30, Math.min(cell, 56));
    document.documentElement.style.setProperty("--cell", clamped + "px");
  }
  window.addEventListener("resize", fitBoard);
  fitBoard();

  init();
})();
</script>
</body>
</html>
