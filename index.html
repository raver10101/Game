<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Candy Crunch</title>
<style>
  :root {
    --board-bg: rgba(255, 255, 255, 0.12);
    --cell: 56px;
    --gap: 6px;
    --accent: #ffaf7b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(160deg, #3a1c71, #d76d77, #ffaf7b);
    color: #fff;
    overflow: hidden;
    user-select: none;
    transition: background 0.5s;
  }
  body.boss {
    background: linear-gradient(160deg, #2b0000, #7a1010, #d94848);
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 12px;
  }

  .game {
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  header { text-align: center; position: relative; }

  h1 {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: 1px;
    text-shadow: 0 3px 0 rgba(0,0,0,0.25);
  }

  .sub {
    font-size: 12px;
    opacity: 0.8;
    margin-top: 2px;
    min-height: 16px;
  }
  .sub .boss-tag {
    color: #ffd23f;
    font-weight: 800;
    letter-spacing: 1px;
    animation: pulseTag 0.8s infinite alternate;
  }
  @keyframes pulseTag { from { opacity: 0.6; } to { opacity: 1; } }

  #mute {
    position: absolute;
    right: 0;
    top: 0;
    background: rgba(0,0,0,0.25);
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 38px;
    height: 38px;
    font-size: 18px;
    box-shadow: none;
    padding: 0;
    cursor: pointer;
  }
  #mute:active { transform: none; }

  .stats {
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }

  .stat {
    flex: 1;
    background: rgba(0,0,0,0.22);
    border-radius: 12px;
    padding: 7px 4px;
    text-align: center;
    backdrop-filter: blur(4px);
  }
  .stat .label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    opacity: 0.75;
  }
  .stat .value { font-size: 20px; font-weight: 700; }

  .board-wrap { position: relative; align-self: center; }

  #board {
    display: grid;
    gap: var(--gap);
    padding: var(--gap);
    background: var(--board-bg);
    border-radius: 18px;
    box-shadow: inset 0 2px 10px rgba(0,0,0,0.3);
    touch-action: none;
  }
  body.boss #board { box-shadow: inset 0 0 0 2px rgba(255,80,80,0.6), inset 0 2px 10px rgba(0,0,0,0.4); }

  .cell {
    width: var(--cell);
    height: var(--cell);
    border-radius: 12px;
    background: rgba(0,0,0,0.15);
    position: relative;
  }

  .candy {
    position: absolute;
    inset: 3px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    overflow: hidden;
    box-shadow: inset -4px -4px 8px rgba(0,0,0,0.25), inset 3px 3px 6px rgba(255,255,255,0.35);
    transition: transform 0.16s ease, opacity 0.16s ease;
    will-change: transform;
  }
  .candy.selected {
    transform: scale(1.16);
    box-shadow: 0 0 0 3px #fff, inset -4px -4px 8px rgba(0,0,0,0.25);
    z-index: 3;
  }
  .candy.pop { transform: scale(0); opacity: 0; }
  .candy.falling { transition: transform 0.28s cubic-bezier(.34,1.4,.64,1); }
  .candy.special-pop { animation: specialPop 0.4s ease; }
  @keyframes specialPop {
    0% { transform: scale(0.4); }
    55% { transform: scale(1.28); }
    100% { transform: scale(1); }
  }

  .c0 { background: radial-gradient(circle at 32% 28%, #ff8a8a, #e01e1e); }
  .c1 { background: radial-gradient(circle at 32% 28%, #ffd27f, #f5940b); }
  .c2 { background: radial-gradient(circle at 32% 28%, #fff28a, #e5c400); }
  .c3 { background: radial-gradient(circle at 32% 28%, #9dffb0, #17a836); }
  .c4 { background: radial-gradient(circle at 32% 28%, #9ad4ff, #1275e0); }
  .c5 { background: radial-gradient(circle at 32% 28%, #d7a8ff, #8b26d9); }

  /* striped special: overlay of glossy stripes */
  .candy.striped::after {
    content: "";
    position: absolute;
    inset: 0;
    mix-blend-mode: overlay;
  }
  .candy.striped.row::after {
    background: repeating-linear-gradient(0deg, rgba(255,255,255,0.85) 0 4px, transparent 4px 10px);
  }
  .candy.striped.col::after {
    background: repeating-linear-gradient(90deg, rgba(255,255,255,0.85) 0 4px, transparent 4px 10px);
  }

  /* wrapped special: glowing ring */
  .candy.wrap {
    box-shadow: 0 0 0 3px #fff, 0 0 12px 3px rgba(255,255,255,0.9), inset -4px -4px 8px rgba(0,0,0,0.25);
    animation: wrapGlow 1.1s infinite alternate;
  }
  @keyframes wrapGlow {
    from { box-shadow: 0 0 0 3px #fff, 0 0 8px 2px rgba(255,255,255,0.7), inset -4px -4px 8px rgba(0,0,0,0.25); }
    to   { box-shadow: 0 0 0 3px #fff, 0 0 16px 5px rgba(255,255,255,1), inset -4px -4px 8px rgba(0,0,0,0.25); }
  }

  /* color bomb: rainbow lollipop */
  .candy.bomb {
    background: conic-gradient(#e01e1e, #f5940b, #e5c400, #17a836, #1275e0, #8b26d9, #e01e1e);
    box-shadow: 0 0 10px 2px rgba(255,255,255,0.7), inset -4px -4px 8px rgba(0,0,0,0.2);
    animation: bombSpin 3s linear infinite;
  }
  @keyframes bombSpin { to { transform: rotate(360deg); } }
  .candy.bomb.selected { animation: none; }

  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(20, 6, 40, 0.85);
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 20px;
    backdrop-filter: blur(3px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    z-index: 10;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .overlay h2 { font-size: 30px; }
  .overlay p { font-size: 15px; opacity: 0.9; line-height: 1.4; }

  button {
    font-family: inherit;
    font-size: 17px;
    font-weight: 700;
    color: #3a1c71;
    background: #fff;
    border: none;
    border-radius: 30px;
    padding: 12px 28px;
    cursor: pointer;
    box-shadow: 0 4px 0 rgba(0,0,0,0.25);
    transition: transform 0.1s;
  }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,0.25); }

  .footer { text-align: center; font-size: 12px; opacity: 0.7; line-height: 1.4; }

  .float-score {
    position: absolute;
    font-weight: 800;
    font-size: 19px;
    color: #fff;
    text-shadow: 0 2px 4px rgba(0,0,0,0.6);
    pointer-events: none;
    animation: floatUp 0.7s ease-out forwards;
    z-index: 5;
  }
  @keyframes floatUp {
    0% { transform: translateY(0) scale(0.6); opacity: 0; }
    30% { opacity: 1; transform: translateY(-6px) scale(1.1); }
    100% { transform: translateY(-38px) scale(1); opacity: 0; }
  }
</style>
</head>
<body>
  <div class="game">
    <header>
      <h1>🍬 Candy Crunch</h1>
      <div class="sub" id="sub"></div>
      <button id="mute" title="Toggle sound">🔊</button>
    </header>

    <div class="stats">
      <div class="stat"><div class="label">Level</div><div class="value" id="level">1</div></div>
      <div class="stat"><div class="label">Score</div><div class="value" id="score">0</div></div>
      <div class="stat"><div class="label">Target</div><div class="value" id="target">0</div></div>
      <div class="stat"><div class="label">Moves</div><div class="value" id="moves">0</div></div>
    </div>

    <div class="board-wrap">
      <div id="board"></div>
      <div class="overlay" id="overlay">
        <h2 id="over-title">Level Complete!</h2>
        <p id="over-msg"></p>
        <button id="action">Next Level</button>
      </div>
    </div>

    <div class="footer">
      Match 4 → <b>striped</b> (clears a line) · Match 5 → <b>🍭 color bomb</b> · L/T match → <b>wrapped</b> (3×3 blast).<br>
      Swap a color bomb with any candy to blast that whole color!
    </div>
  </div>

<script>
(() => {
  "use strict";

  const SIZE = 8;
  const TYPES = 6;
  const EMOJI = ["🍒", "🍊", "🍋", "🍏", "🫐", "🍇"];

  const boardEl = document.getElementById("board");
  const levelEl = document.getElementById("level");
  const scoreEl = document.getElementById("score");
  const movesEl = document.getElementById("moves");
  const targetEl = document.getElementById("target");
  const subEl = document.getElementById("sub");
  const overlay = document.getElementById("overlay");
  const overTitle = document.getElementById("over-title");
  const overMsg = document.getElementById("over-msg");
  const actionBtn = document.getElementById("action");
  const muteBtn = document.getElementById("mute");

  // grid[r][c] = { color: int (-1 = colorless bomb), special: null|'row'|'col'|'wrap'|'bomb' } | null
  let grid = [];
  let cells = [];
  let score = 0;
  let moves = 0;
  let target = 0;
  let level = 1;
  let hardLevel = false;
  let busy = false;
  let selected = null;

  // ---- persistence ----
  // localStorage may be unavailable (sandboxed/private contexts); fall back to memory.
  const mem = {};
  const ls = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return k in mem ? mem[k] : null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { mem[k] = String(v); } }
  };
  const store = {
    get level() { return parseInt(ls.get("cc_level") || "1", 10); },
    set level(v) { ls.set("cc_level", v); },
    get best() { return parseInt(ls.get("cc_best") || "0", 10); },
    set best(v) { ls.set("cc_best", v); },
    get muted() { return ls.get("cc_muted") === "1"; },
    set muted(v) { ls.set("cc_muted", v ? "1" : "0"); }
  };

  const idx = (r, c) => r * SIZE + c;
  const rowOf = (i) => Math.floor(i / SIZE);
  const colOf = (i) => i % SIZE;
  const inBounds = (r, c) => r >= 0 && r < SIZE && c >= 0 && c < SIZE;
  const rand = () => Math.floor(Math.random() * TYPES);
  const delay = (ms) => new Promise(res => setTimeout(res, ms));
  const make = (color, special = null) => ({ color, special });
  const colorAt = (r, c) => (grid[r][c] ? grid[r][c].color : -1);

  // ================= Audio =================
  let actx = null;
  let muted = store.muted;
  function audioCtx() {
    if (!actx) {
      try { actx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { actx = null; }
    }
    return actx;
  }
  function tone(freq, dur, type = "sine", vol = 0.18, when = 0) {
    const a = audioCtx();
    if (!a || muted) return;
    const o = a.createOscillator();
    const g = a.createGain();
    o.type = type;
    o.frequency.value = freq;
    o.connect(g); g.connect(a.destination);
    const t = a.currentTime + when;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.start(t); o.stop(t + dur + 0.02);
  }
  const sfx = {
    swap()    { tone(520, 0.08, "triangle", 0.15); tone(660, 0.08, "triangle", 0.13, 0.05); },
    invalid() { tone(150, 0.18, "sawtooth", 0.16); },
    pop(cascade) { tone(400 + Math.min(cascade, 8) * 80, 0.1, "square", 0.13); },
    special() { [660, 880, 1180].forEach((f, i) => tone(f, 0.12, "triangle", 0.16, i * 0.05)); },
    boom()    { tone(90, 0.28, "sawtooth", 0.22); tone(180, 0.2, "square", 0.12, 0.02); },
    win()     { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.22, "triangle", 0.2, i * 0.11)); },
    lose()    { [440, 349, 262].forEach((f, i) => tone(f, 0.3, "sine", 0.2, i * 0.13)); }
  };
  function updateMuteBtn() { muteBtn.textContent = muted ? "🔇" : "🔊"; }
  muteBtn.addEventListener("click", () => {
    muted = !muted;
    store.muted = muted;
    updateMuteBtn();
    if (!muted) sfx.swap();
  });
  updateMuteBtn();

  // ================= Level config =================
  function levelConfig(lv) {
    const boss = lv % 10 === 0;
    const base = 1000 + (lv - 1) * 350;
    return {
      target: Math.round(boss ? base * 1.9 : base),
      moves: boss ? 15 : 22,
      boss
    };
  }

  // ================= Board build / fill =================
  function buildDOM() {
    boardEl.style.gridTemplateColumns = `repeat(${SIZE}, var(--cell))`;
    boardEl.innerHTML = "";
    cells = [];
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const cell = document.createElement("div");
        cell.className = "cell";
        boardEl.appendChild(cell);
        cells.push(cell);
      }
    }
  }

  function fillGrid() {
    grid = [];
    for (let r = 0; r < SIZE; r++) {
      grid.push([]);
      for (let c = 0; c < SIZE; c++) {
        let t;
        do {
          t = rand();
        } while (
          (c >= 2 && colorAtRaw(grid, r, c - 1) === t && colorAtRaw(grid, r, c - 2) === t) ||
          (r >= 2 && colorAtRaw(grid, r - 1, c) === t && colorAtRaw(grid, r - 2, c) === t)
        );
        grid[r].push(make(t));
      }
    }
    if (!hasPossibleMove()) fillGrid();
  }
  function colorAtRaw(g, r, c) { return g[r] && g[r][c] ? g[r][c].color : -1; }

  function renderAll() {
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        renderCell(r, c);
  }

  function renderCell(r, c) {
    const cell = cells[idx(r, c)];
    cell.innerHTML = "";
    const g = grid[r][c];
    if (!g) return;
    const candy = document.createElement("div");
    candy.dataset.r = r;
    candy.dataset.c = c;
    if (g.special === "bomb") {
      candy.className = "candy bomb";
      candy.textContent = "🍭";
    } else {
      candy.className = "candy c" + g.color;
      candy.textContent = EMOJI[g.color];
      if (g.special === "row" || g.special === "col") candy.classList.add("striped", g.special);
      else if (g.special === "wrap") candy.classList.add("wrap");
    }
    cell.appendChild(candy);
  }

  function candyAt(r, c) { return cells[idx(r, c)].firstChild; }

  // ================= Match detection =================
  function findMatches() {
    const matched = new Set();
    for (let r = 0; r < SIZE; r++) {
      let run = 1;
      for (let c = 1; c <= SIZE; c++) {
        if (c < SIZE && colorAt(r, c) === colorAt(r, c - 1) && colorAt(r, c) >= 0) run++;
        else { if (run >= 3) for (let k = c - run; k < c; k++) matched.add(idx(r, k)); run = 1; }
      }
    }
    for (let c = 0; c < SIZE; c++) {
      let run = 1;
      for (let r = 1; r <= SIZE; r++) {
        if (r < SIZE && colorAt(r, c) === colorAt(r - 1, c) && colorAt(r, c) >= 0) run++;
        else { if (run >= 3) for (let k = r - run; k < r; k++) matched.add(idx(k, c)); run = 1; }
      }
    }
    return matched;
  }

  // Return list of maximal runs (>=3): {cells:[idx], dir:'h'|'v', color, len}
  function findRuns() {
    const runs = [];
    for (let r = 0; r < SIZE; r++) {
      let c = 0;
      while (c < SIZE) {
        const col = colorAt(r, c);
        if (col < 0) { c++; continue; }
        let k = c + 1;
        while (k < SIZE && colorAt(r, k) === col) k++;
        if (k - c >= 3) {
          const arr = []; for (let x = c; x < k; x++) arr.push(idx(r, x));
          runs.push({ cells: arr, dir: "h", color: col, len: k - c });
        }
        c = k;
      }
    }
    for (let c = 0; c < SIZE; c++) {
      let r = 0;
      while (r < SIZE) {
        const col = colorAt(r, c);
        if (col < 0) { r++; continue; }
        let k = r + 1;
        while (k < SIZE && colorAt(k, c) === col) k++;
        if (k - r >= 3) {
          const arr = []; for (let x = r; x < k; x++) arr.push(idx(x, c));
          runs.push({ cells: arr, dir: "v", color: col, len: k - r });
        }
        r = k;
      }
    }
    return runs;
  }

  function swapData(r1, c1, r2, c2) {
    const tmp = grid[r1][c1];
    grid[r1][c1] = grid[r2][c2];
    grid[r2][c2] = tmp;
  }

  function wouldMatch(r1, c1, r2, c2) {
    swapData(r1, c1, r2, c2);
    const m = findMatches();
    swapData(r1, c1, r2, c2);
    return m.size > 0;
  }

  function hasPossibleMove() {
    // a color bomb can always be activated by swapping
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (grid[r][c] && grid[r][c].special === "bomb") return true;
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++) {
        if (c + 1 < SIZE && wouldMatch(r, c, r, c + 1)) return true;
        if (r + 1 < SIZE && wouldMatch(r, c, r + 1, c)) return true;
      }
    return false;
  }

  function mostCommonColor() {
    const cnt = new Array(TYPES).fill(0);
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++) {
        const col = colorAt(r, c);
        if (col >= 0) cnt[col]++;
      }
    let best = 0;
    for (let i = 1; i < TYPES; i++) if (cnt[i] > cnt[best]) best = i;
    return best;
  }

  // Cells cleared when a special detonates
  function detonationCells(index, type) {
    const r = rowOf(index), c = colOf(index);
    const out = [];
    if (type === "row") { for (let x = 0; x < SIZE; x++) out.push(idx(r, x)); }
    else if (type === "col") { for (let x = 0; x < SIZE; x++) out.push(idx(x, c)); }
    else if (type === "wrap") {
      for (let dr = -1; dr <= 1; dr++)
        for (let dc = -1; dc <= 1; dc++)
          if (inBounds(r + dr, c + dc)) out.push(idx(r + dr, c + dc));
    } else if (type === "bomb") {
      const tc = mostCommonColor();
      for (let rr = 0; rr < SIZE; rr++)
        for (let cc = 0; cc < SIZE; cc++)
          if (colorAt(rr, cc) === tc) out.push(idx(rr, cc));
    }
    return out;
  }

  // Grow a clear set by detonating any specials caught in it (chain reactions).
  function expandDetonations(clearSet, protectedSet) {
    const stack = [...clearSet];
    while (stack.length) {
      const i = stack.pop();
      const g = grid[rowOf(i)][colOf(i)];
      if (g && g.special) {
        for (const d of detonationCells(i, g.special)) {
          if (!clearSet.has(d) && !(protectedSet && protectedSet.has(d))) {
            clearSet.add(d);
            stack.push(d);
          }
        }
      }
    }
    return clearSet;
  }

  // ================= Swap & resolve =================
  async function trySwap(r1, c1, r2, c2) {
    if (busy || !inBounds(r2, c2)) return;
    if (!grid[r1][c1] || !grid[r2][c2]) return;
    busy = true;
    clearSelection();

    await animateSwap(r1, c1, r2, c2);
    swapData(r1, c1, r2, c2);
    renderCell(r1, c1); renderCell(r2, c2);

    const A = grid[r1][c1], B = grid[r2][c2];
    const bombSwap = A.special === "bomb" || B.special === "bomb";

    if (bombSwap) {
      sfx.special();
      moves--; updateStats();
      const clearSet = bombSwapClears(r1, c1, r2, c2);
      await clearAndCollapse(clearSet, 1, null);
      await resolveMatches();
      busy = false;
      checkEndState();
      return;
    }

    const matches = findMatches();
    if (matches.size === 0) {
      sfx.invalid();
      await animateSwap(r1, c1, r2, c2);
      swapData(r1, c1, r2, c2);
      renderCell(r1, c1); renderCell(r2, c2);
      busy = false;
      return;
    }

    sfx.swap();
    moves--; updateStats();
    await resolveMatches(idx(r2, c2));
    busy = false;
    checkEndState();
  }

  function bombSwapClears(r1, c1, r2, c2) {
    const A = grid[r1][c1], B = grid[r2][c2];
    const clearSet = new Set([idx(r1, c1), idx(r2, c2)]);
    if (A.special === "bomb" && B.special === "bomb") {
      // clear the whole board
      for (let r = 0; r < SIZE; r++)
        for (let c = 0; c < SIZE; c++)
          if (grid[r][c]) clearSet.add(idx(r, c));
    } else {
      const other = A.special === "bomb" ? B : A;
      const tc = other.color >= 0 ? other.color : mostCommonColor();
      for (let r = 0; r < SIZE; r++)
        for (let c = 0; c < SIZE; c++)
          if (colorAt(r, c) === tc) clearSet.add(idx(r, c));
    }
    return expandDetonations(clearSet, null);
  }

  // Run the full cascade of colour-matches. swapDest biases special placement.
  async function resolveMatches(swapDest) {
    let cascade = 0;
    let dest = swapDest;
    while (true) {
      const runs = findRuns();
      if (runs.length === 0) break;
      cascade++;
      if (cascade > 60) break; // safety backstop against pathological cascades

      const matched = new Set();
      runs.forEach(run => run.cells.forEach(i => matched.add(i)));

      // Which cells belong to both an H run and a V run (for wrapped candies)
      const inH = new Set(), inV = new Set();
      runs.forEach(run => run.cells.forEach(i => (run.dir === "h" ? inH : inV).add(i)));

      // Decide specials to create
      const createMap = new Map(); // idx -> {type, color}
      const rank = { bomb: 3, wrap: 2, row: 1, col: 1 };
      const setSpecial = (i, type, color) => {
        const ex = createMap.get(i);
        if (ex && rank[ex.type] >= rank[type]) return;
        createMap.set(i, { type, color });
      };
      // intersections -> wrapped (only promote a normal candy, never an existing special)
      matched.forEach(i => {
        const g = grid[rowOf(i)][colOf(i)];
        if (inH.has(i) && inV.has(i) && g && !g.special) setSpecial(i, "wrap", g.color);
      });
      // line runs -> striped / bomb (anchor must be a normal candy so special-only
      // runs merely detonate instead of endlessly regenerating specials)
      runs.forEach(run => {
        const anchor = pickAnchor(run, dest);
        if (anchor === null) return;
        if (run.len >= 5) setSpecial(anchor, "bomb", -1);
        else if (run.len === 4) setSpecial(anchor, run.dir === "h" ? "row" : "col", run.color);
      });
      dest = undefined; // only the first cascade honours the swap position

      // Build clear set: matched cells that don't become new specials, plus chained detonations
      const protectedSet = new Set(createMap.keys());
      const clearSet = new Set();
      matched.forEach(i => { if (!protectedSet.has(i)) clearSet.add(i); });
      expandDetonations(clearSet, protectedSet);

      await clearAndCollapse(clearSet, cascade, createMap);
    }
  }

  function pickAnchor(run, dest) {
    // Only a normal (non-special) candy may be promoted to a new special.
    const normals = run.cells.filter(i => {
      const g = grid[rowOf(i)][colOf(i)];
      return g && !g.special;
    });
    if (normals.length === 0) return null;
    if (dest !== undefined && normals.includes(dest)) return dest;
    return normals[Math.floor(normals.length / 2)];
  }

  async function clearAndCollapse(clearSet, cascade, createMap) {
    if (clearSet.size === 0 && (!createMap || createMap.size === 0)) return;

    // detect whether a special detonated (for sound) before we mutate the grid
    let boom = false;
    clearSet.forEach(i => { const g = grid[rowOf(i)][colOf(i)]; if (g && g.special) boom = true; });

    const gained = clearSet.size * 30 * cascade + (createMap ? createMap.size * 60 : 0);
    score += gained;
    if (gained > 0) showFloatScore(clearSet.size ? clearSet : new Set(createMap.keys()), gained);
    updateStats();

    if (boom) sfx.boom(); else sfx.pop(cascade);
    if (createMap && createMap.size) sfx.special();

    clearSet.forEach(i => { const el = cells[i].firstChild; if (el) el.classList.add("pop"); });
    await delay(200);

    clearSet.forEach(i => { grid[rowOf(i)][colOf(i)] = null; });
    if (createMap) createMap.forEach((v, i) => { grid[rowOf(i)][colOf(i)] = make(v.color, v.type); });

    applyGravity();
    await animateDrops(createMap);
  }

  function applyGravity() {
    for (let c = 0; c < SIZE; c++) {
      let write = SIZE - 1;
      for (let r = SIZE - 1; r >= 0; r--) {
        if (grid[r][c]) {
          grid[write][c] = grid[r][c];
          if (write !== r) grid[r][c] = null;
          write--;
        }
      }
      for (let r = write; r >= 0; r--) grid[r][c] = make(rand());
    }
  }

  async function animateDrops(createMap) {
    renderAll();
    const candies = boardEl.querySelectorAll(".candy");
    candies.forEach(cd => {
      cd.classList.add("falling");
      cd.style.transform = "translateY(-12px)";
      cd.style.opacity = "0.4";
    });
    void boardEl.offsetHeight;
    requestAnimationFrame(() => {
      candies.forEach(cd => { cd.style.transform = ""; cd.style.opacity = ""; });
    });
    if (createMap) {
      createMap.forEach((v, i) => {
        const el = cells[i].firstChild;
        if (el) el.classList.add("special-pop");
      });
    }
    await delay(280);
    candies.forEach(cd => cd.classList.remove("falling"));
  }

  function showFloatScore(set, gained) {
    let sr = 0, sc = 0;
    set.forEach(i => { sr += rowOf(i); sc += colOf(i); });
    const n = set.size || 1;
    const step = parseGap();
    const fs = document.createElement("div");
    fs.className = "float-score";
    fs.textContent = "+" + gained;
    fs.style.left = ((sc / n) * step + 6) + "px";
    fs.style.top = ((sr / n) * step + 6) + "px";
    document.querySelector(".board-wrap").appendChild(fs);
    setTimeout(() => fs.remove(), 700);
  }

  // ================= Swap animation =================
  function animateSwap(r1, c1, r2, c2) {
    const a = candyAt(r1, c1), b = candyAt(r2, c2);
    if (!a || !b) return Promise.resolve();
    const step = parseGap();
    const dx = c2 - c1, dy = r2 - r1;
    a.style.transform = `translate(${dx * step}px, ${dy * step}px)`;
    b.style.transform = `translate(${-dx * step}px, ${-dy * step}px)`;
    return delay(170).then(() => { a.style.transform = ""; b.style.transform = ""; });
  }

  function parseGap() {
    const s = getComputedStyle(document.documentElement);
    return parseFloat(s.getPropertyValue("--cell")) + parseFloat(s.getPropertyValue("--gap"));
  }

  // ================= Input =================
  let dragStart = null;

  boardEl.addEventListener("pointerdown", (e) => {
    audioCtx(); // unlock audio on first gesture
    const candy = e.target.closest(".candy");
    if (!candy || busy) return;
    const r = +candy.dataset.r, c = +candy.dataset.c;
    dragStart = { r, c, x: e.clientX, y: e.clientY };
    if (selected) {
      const dr = Math.abs(selected.r - r), dc = Math.abs(selected.c - c);
      if (dr + dc === 1) { trySwap(selected.r, selected.c, r, c); return; }
    }
    selectCandy(r, c);
  });

  boardEl.addEventListener("pointerup", (e) => {
    if (!dragStart || busy) { dragStart = null; return; }
    const dx = e.clientX - dragStart.x, dy = e.clientY - dragStart.y;
    const absX = Math.abs(dx), absY = Math.abs(dy);
    if (Math.max(absX, absY) > 18) {
      let nr = dragStart.r, nc = dragStart.c;
      if (absX > absY) nc += dx > 0 ? 1 : -1;
      else nr += dy > 0 ? 1 : -1;
      trySwap(dragStart.r, dragStart.c, nr, nc);
    }
    dragStart = null;
  });

  function selectCandy(r, c) {
    clearSelection();
    selected = { r, c };
    const cd = candyAt(r, c);
    if (cd) cd.classList.add("selected");
  }
  function clearSelection() {
    if (selected) {
      const cd = candyAt(selected.r, selected.c);
      if (cd) cd.classList.remove("selected");
    }
    selected = null;
  }

  // ================= Stats & end state =================
  function updateStats() {
    levelEl.textContent = level;
    scoreEl.textContent = score;
    movesEl.textContent = moves;
    targetEl.textContent = target;
    const best = store.best;
    subEl.innerHTML = (hardLevel ? '<span class="boss-tag">⚠ BOSS LEVEL</span> · ' : "") + "Best: " + Math.max(best, score);
  }

  function checkEndState() {
    if (score >= target) { winLevel(); }
    else if (moves <= 0) { loseLevel(); }
    else if (!hasPossibleMove()) { reshuffle(); }
  }

  async function reshuffle() {
    busy = true;
    do {
      const flat = [];
      for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) flat.push(grid[r][c]);
      for (let i = flat.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [flat[i], flat[j]] = [flat[j], flat[i]];
      }
      let k = 0;
      for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) grid[r][c] = flat[k++];
    } while (findMatches().size > 0 || !hasPossibleMove());
    renderAll();
    busy = false;
  }

  function winLevel() {
    if (score > store.best) store.best = score;
    level += 1;
    store.level = level;
    const next = levelConfig(level);
    sfx.win();
    overTitle.textContent = "🎉 Level Complete!";
    overMsg.textContent = `You scored ${score}! Up next: Level ${level}` +
      (next.boss ? " — a BOSS level (target " + next.target + ", only " + next.moves + " moves). Brace yourself!" : ".");
    actionBtn.textContent = "Next Level →";
    overlay.classList.add("show");
  }

  function loseLevel() {
    sfx.lose();
    overTitle.textContent = "Out of Moves";
    overMsg.textContent = `You scored ${score}. Target was ${target}. So close — give Level ${level} another go!`;
    actionBtn.textContent = "Retry Level";
    overlay.classList.add("show");
  }

  actionBtn.addEventListener("click", () => startLevel(level));

  // ================= Init =================
  function startLevel(lv) {
    level = lv;
    const cfg = levelConfig(lv);
    target = cfg.target;
    moves = cfg.moves;
    hardLevel = cfg.boss;
    document.body.classList.toggle("boss", hardLevel);
    score = 0;
    selected = null;
    busy = false;
    overlay.classList.remove("show");
    buildDOM();
    fillGrid();
    renderAll();
    updateStats();
    resolveInitial();
  }

  async function resolveInitial() {
    if (findMatches().size > 0) {
      busy = true;
      await resolveMatches();
      score = 0;
      updateStats();
      busy = false;
    }
  }

  function fitBoard() {
    const maxW = Math.min(window.innerWidth - 24, 460);
    const gap = 6;
    const cell = Math.floor((maxW - gap * (SIZE + 1)) / SIZE);
    document.documentElement.style.setProperty("--cell", Math.max(30, Math.min(cell, 56)) + "px");
  }
  window.addEventListener("resize", fitBoard);
  fitBoard();

  // debug hooks for automated testing
  window.__cc = {
    setGrid(fn) { fn(grid, make); renderAll(); },
    resolve: resolveMatches,
    state: () => ({ score, moves, level, target, busy }),
    grid: () => grid
  };

  startLevel(store.level);
})();
</script>
</body>
</html>
